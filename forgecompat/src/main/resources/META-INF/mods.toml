modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/yourusername/forgecompat/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# CoreMod configuration - this is how Forge loads our transformer
[[accessTransformers]]
# No AT needed for now

# CoreMod entry point
[[dependencies.${mod_id}]]
    modId="forge"
    type="required"
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# CoreMod declaration
[[coremods]]
    # This tells Forge to load our JavaScript CoreMod
    # The JS file bridges to our Java ForgeCompatTransformer
    id = "forgecompat_coremod"
    entrypoint = "forgecompat_coremod.js"
