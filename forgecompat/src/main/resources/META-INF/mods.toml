[[mods]]
modId="forgecompat"
version="0.1.0"
displayName="ForgeCompat"
authors=["DevMaster1015"]
description='''A compatibility layer that translates 1.19.2 Forge mods to run on 1.20.1'''

# CoreMod for bytecode transformation
[[coremods]]
id = "forgecompat"
entrypoint = "forgecompat_coremod.js"

# Base Forge
[[dependencies.forgecompat]]
    modId="forge"
    mandatory=true
    versionRange="[47,)"
    ordering="NONE"
    side="BOTH"

# Base Minecraft
[[dependencies.forgecompat]]
    modId="minecraft"
    mandatory=true
    versionRange="[1.20.1,1.21)"
    ordering="NONE"
    side="BOTH"
